services:
  canyon:
    build:
      context: .
      args:
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-}
        - VITE_GOOGLE_MAPS_MAP_ID=${VITE_GOOGLE_MAPS_MAP_ID:-}
        - VITE_POCKETBASE_URL=${VITE_POCKETBASE_URL:-http://canyon-db:8090}
    container_name: canyon
    restart: unless-stopped
    ports:
      - "8202:80"
    depends_on:
      - db
    networks:
      - net_core

  db:
    build:
      context: ./pocketbase
    container_name: canyon-db
    restart: unless-stopped
    # No published port: PocketBase (including its /_/ admin UI) is reached
    # only via the nginx proxy on the `canyon` service, or from other
    # containers on net_core at canyon-db:8090. See README "Admin access".
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - canyon-data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations
      - ./pocketbase/pb_hooks:/pb/pb_hooks
    networks:
      - net_core

volumes:
  canyon-data:

networks:
  net_core:
    external: true
